[workspace]
resolver = "2"
members = [
    "petro-chunked-schema",
    "petro-chunked-schema-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
petro-chunked = { git = "https://github.com/bytemanzer/baw.git" }
petro-meg = "1.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
