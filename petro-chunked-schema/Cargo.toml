[package]
name = "petro-chunked-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YAML schema descriptor format, dynamic loader, and Rust codegen for Petroglyph chunked binary files"

[features]
default = ["known-formats"]
known-formats = []
codegen = ["dep:prettyplease", "dep:proc-macro2", "dep:quote", "dep:syn"]

[dependencies]
indexmap.workspace = true
petro-chunked.workspace = true
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true

prettyplease = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
